{% extends "wblog/base.html" %}
 
{% block content %}
 
<style>
    .auth-layout {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 2rem;
    }
    .auth-eyebrow {
        font-size: 0.7rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 0.75rem;
    }
    .auth-layout h1 { text-align: center; margin-bottom: 2.5rem; }
    .auth-layout .form-card { width: 100%; }
    .auth-footer {
        margin-top: 1.5rem;
        font-size: 0.85rem;
        color: var(--muted);
        text-align: center;
    }
</style>
 
<div class="auth-layout">
    <p class="auth-eyebrow">Join the blog</p>
    <h1>Create Account</h1>
 
    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-solid mt-4" style="width:100%;">Sign Up</button>
        </form>
    </div>
 
    <p class="auth-footer">
        Already have an account? <a href="{% url 'login' %}">Login</a>
    </p>
</div>
 
{% endblock %}
