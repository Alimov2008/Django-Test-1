{%extends 'wblog/base.html'%}

{%block content%}
<h2>Posts</h2>

<h2><a href="{%url 'post_create'%}">Create post</a></h2>

{%for post in posts%}
<a href="{%url 'post_detail' post.pk%}">{{post.title}}</a>
<p>{{post.context}}</p>

<p>
Created at {{post.created_at}}
{%if post.updated_at != post.created_at%}
    Updated at {{post.updated_at}}
{%endif%}
</p>

{%endfor%}

{%endblock%}
