<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBlog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
        :root {
            --bg:        #0f0e0c;
            --surface:   #1a1814;
            --border:    #2e2b26;
            --ink:       #f0ead8;
            --muted:     #8a8070;
            --accent:    #c8973a;
            --accent2:   #e8c87a;
            --danger:    #c05040;
            --radius:    4px;
            --max-w:     780px;
        }
 
        html { font-size: 16px; }
 
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
 
        /* ── Grain overlay ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 9999;
        }
 
        /* ── Top bar ── */
        .topbar {
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            position: sticky;
            top: 0;
            background: rgba(15,14,12,0.92);
            backdrop-filter: blur(8px);
            z-index: 100;
        }
 
        .topbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--ink);
            text-decoration: none;
        }
 
        .topbar-brand span { color: var(--accent); }
 
        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }
 
        .topbar-nav a {
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
 
        .topbar-nav a:hover { color: var(--ink); }
 
        /* ── Main content ── */
        main {
            flex: 1;
            max-width: var(--max-w);
            width: 100%;
            margin: 0 auto;
            padding: 3.5rem 1.5rem 5rem;
            animation: fadeUp 0.4s ease both;
        }
 
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
 
        /* ── Typography ── */
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            line-height: 1.2;
            color: var(--ink);
        }
 
        h1 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 1.5rem; }
        h2 { font-size: clamp(1.4rem, 3vw, 1.9rem); margin-bottom: 1rem; }
        h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
 
        p { margin-bottom: 1rem; color: var(--ink); }
 
        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover { color: var(--accent2); }
 
        /* ── Divider ── */
        .rule {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2.5rem 0;
        }
 
        /* ── Buttons ── */
        .btn {
            display: inline-block;
            padding: 0.55rem 1.4rem;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            text-decoration: none;
            border-radius: var(--radius);
        }
        .btn:hover { background: var(--accent); color: var(--bg); }
 
        .btn-solid {
            background: var(--accent);
            color: var(--bg);
        }
        .btn-solid:hover { background: var(--accent2); border-color: var(--accent2); color: var(--bg); }
 
        .btn-danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-danger:hover { background: var(--danger); color: #fff; }
 
        .btn-ghost {
            border-color: var(--border);
            color: var(--muted);
        }
        .btn-ghost:hover { border-color: var(--muted); color: var(--ink); background: transparent; }
 
        /* ── Forms ── */
        .form-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem 2rem;
            max-width: 500px;
        }
 
        .form-card p { margin-bottom: 1.2rem; }
 
        .form-card label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.35rem;
        }
 
        .form-card input[type="text"],
        .form-card input[type="password"],
        .form-card textarea,
        .form-card select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--ink);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            padding: 0.6rem 0.85rem;
            transition: border-color 0.2s;
            outline: none;
        }
 
        .form-card input:focus,
        .form-card textarea:focus {
            border-color: var(--accent);
        }
 
        .form-card textarea { min-height: 160px; resize: vertical; }
 
        .form-card ul.errorlist {
            list-style: none;
            color: var(--danger);
            font-size: 0.8rem;
            margin: 0.25rem 0 0.5rem;
        }
 
        .form-card .helptext {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.25rem;
        }
 
        /* ── Footer ── */
        footer {
            border-top: 1px solid var(--border);
            text-align: center;
            padding: 1.5rem;
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.05em;
        }
 
        /* ── Utility ── */
        .flex { display: flex; }
        .items-center { align-items: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-6 { margin-top: 1.5rem; }
        .muted { color: var(--muted); font-size: 0.85rem; }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="{% url 'home_page' %}" class="topbar-brand">W<span>.</span>Blog</a>
        <nav>
            <ul class="topbar-nav">
                <li><a href="{% url 'home_page' %}">Home</a></li>
                <li><a href="{% url 'post_list' %}">Posts</a></li>
            </ul>
        </nav>
    </header>
 
    <main>
        {%block content%}
        {%endblock%}
    </main>
 
    <footer>
        &copy; WBlog &mdash; a place for words
    </footer>
</body>
</html>
